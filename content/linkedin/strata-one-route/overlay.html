<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Health systems buy better together.</title>
<meta name="description" content="LinkedIn post overlay: Many lists. One route.">
<link rel="stylesheet" href="../../../brand/system.css">
<style>html,body{background:transparent} .w{display:inline-block}</style>
<script>
// t in seconds -> sets every element's state; called per frame by the exporter (transform and opacity only)
window.at = t => {
  const e = (a, b) => { const k = Math.min(Math.max((t - a) / (b - a), 0), 1); return 1 - Math.pow(1 - k, 3); };
  document.querySelectorAll(".scrim").forEach(el => el.style.opacity = e(0, .8));
  document.querySelectorAll(".w").forEach((el, i) => { const k = e(.5 + i * .16, 1.2 + i * .16); el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * 28}px)`; });
  const s = document.querySelector(".sub"), k2 = e(1.9, 2.6); s.style.opacity = k2; s.style.transform = `translateY(${(1 - k2) * 18}px)`;
  document.querySelector(".brand").style.opacity = e(2.5, 3.1);
};
</script></head><body>
<section class="slide field" style="background:transparent">
  <div class="scrim" style="left:0;right:0;top:0;height:470px;background:linear-gradient(var(--scrim) 0%, var(--scrim-soft) 60%, transparent 100%)"></div>
  <div class="scrim" style="left:0;right:0;bottom:0;height:360px;background:linear-gradient(transparent 0%, var(--scrim) 100%)"></div>
  <h1 class="head l" style="left:72px;top:110px;width:940px;font-size:112px;color:var(--on-indigo)"><span class="w">Health</span> <span class="w">systems</span> <span class="w">buy</span> <span class="w">better</span> <span class="w">together.</span></h1>
  <p class="lead sub" style="left:72px;top:1130px;width:700px;color:var(--on-indigo)">Axmed pools orders from hospitals, ministries and NGOs, so suppliers compete to serve them.</p>
  <div class="brand" style="right:72px;left:auto;bottom:72px"></div>
</section></body></html>
