<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sina orb · Handover</title><link rel="stylesheet" href="orb.css"></head><body><main><div class="orb-stage"><canvas id="sina" width="320" height="320"></canvas></div><h1>Sina, by Axmed.</h1><div class="controls"><button data-state="idle" aria-pressed="false">Ready</button><button data-state="listening" aria-pressed="false">Listening</button><button data-state="speaking" aria-pressed="true">Speaking</button><button data-state="working" aria-pressed="false">Working</button><button id="pause" aria-pressed="false">Pause</button></div><p>The selected indigo and cyan orb.<br><a href="live.html">Open the editable WebGL version</a></p></main><script src="sina-player.js"></script><script>
window.sina=createSinaOrb(document.getElementById('sina'));document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{sina.setState(b.dataset.state);document.querySelectorAll('[data-state]').forEach(e=>e.setAttribute('aria-pressed',String(e===b)));});document.getElementById('pause').onclick=e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';sina.pause(on);e.currentTarget.setAttribute('aria-pressed',String(on));e.currentTarget.textContent=on?'Resume':'Pause';};
</script></body></html>
